<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TON Кликер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--bg2:#eff1f4;--tx:#0f1419;--tx2:#8391a0;--ac:#2aabee;--ton:#0098ea;--line:#e4e8ec;--ok:#31b545;--bad:#ef5350;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17212b;--bg2:#0e1621;--tx:#f5f5f5;--tx2:#708499;--ac:#5eb5f7;--line:#223040}}
:root[data-theme="dark"]{--bg:#17212b;--bg2:#0e1621;--tx:#f5f5f5;--tx2:#708499;--ac:#5eb5f7;--line:#223040}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{touch-action:manipulation;background:var(--bg2);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center;overflow:hidden}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--bg2);position:relative;overflow:hidden;overflow:clip}
header{background:var(--bg);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:2}
.hl{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#5fc9ff,#0072b8);display:grid;place-items:center;font-size:19px}
.hl b{display:block;line-height:1.1}.hl small{color:var(--tx2);font-size:12px}
.bal{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}.bal i{font-style:normal;color:var(--ton);font-size:15px}
#views{flex:1;position:relative;overflow:hidden;overflow:clip}
section{position:absolute;inset:0;overflow-y:auto;padding:12px;transform:translateX(100%);opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.3,.85,.3,1),opacity .25s}
section.on{transform:none;opacity:1;pointer-events:auto}
section.l{transform:translateX(-28%)}
nav{position:relative;display:flex;background:var(--bg);border-top:1px solid var(--line);z-index:2}
nav button{flex:1;border:0;background:none;padding:9px 0 11px;color:var(--tx2);font:inherit;font-size:12px;cursor:pointer;transition:color .2s}
nav button b{display:block;font-size:21px;font-weight:400;transition:transform .25s}
nav button.on{color:var(--ac)}nav button.on b{transform:translateY(-2px) scale(1.12)}
.ind{position:absolute;top:0;left:0;width:20%;height:2.5px;display:flex;justify-content:center;transition:transform .35s cubic-bezier(.3,.85,.3,1)}
.ind i{width:44px;border-radius:0 0 3px 3px;background:var(--ac)}
.pg{background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.pg .tp{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);margin-bottom:7px}
.bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5fc9ff,var(--ton));border-radius:3px;transition:width .3s}
.tz{position:relative;display:flex;flex-direction:column;align-items:center;padding:16px 0 6px;user-select:none}
#coin{position:relative;width:200px;height:200px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 28%,#8ee0ff,var(--ton) 58%,#0069ad);color:#fff;font-size:88px;box-shadow:0 12px 36px rgba(0,152,234,.4),inset 0 -8px 18px rgba(0,0,0,.18);transition:transform .09s}
#coin.p{transform:scale(.93)}
#coin::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--ton);opacity:0}
#coin.p::after{animation:rg .5s ease-out}
@keyframes rg{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
#coin:focus-visible{outline:3px solid var(--ac);outline-offset:5px}
.chips{display:flex;gap:8px;margin-top:14px}.chips span{background:var(--bg);border-radius:14px;padding:6px 12px;font-size:13px;color:var(--tx2)}.chips b{color:var(--tx)}
.fl{position:absolute;pointer-events:none;font-weight:700;color:var(--ton);font-size:22px;animation:up .85s ease-out forwards}
@keyframes up{to{transform:translateY(-100px);opacity:0}}
h3{margin:16px 4px 8px;font-size:14px;color:var(--tx2);font-weight:600}
.lst{background:var(--bg);border-radius:14px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:600}.row .t span{color:var(--tx2);font-size:13px}
.btn{border:0;border-radius:18px;padding:8px 15px;background:var(--ac);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.95)}.btn:disabled{background:var(--bg2);color:var(--tx2);cursor:default}.btn.dim{background:var(--bg2);color:var(--tx2)}.btn.ghost{background:var(--bg2);color:var(--ac)}
.btn.big{width:100%;padding:14px;border-radius:14px;font-size:16px}.btn.sell{background:#ef5350}
.seg{display:flex;background:var(--bg);border-radius:11px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font:inherit;font-size:14px;color:var(--tx2);cursor:pointer;transition:.25s}
.seg button.on{background:var(--ac);color:#fff}
.fs{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}.fs::-webkit-scrollbar{display:none}
.fs button{flex:none;border:0;background:var(--bg);color:var(--tx2);padding:6px 13px;border-radius:15px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.fs button.on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--bg);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s;animation:pop .45s both}
.card:active{transform:scale(.96)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.th{position:relative;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.th img,.hero img{width:78%;aspect-ratio:1;object-fit:cover;border-radius:50%;position:relative;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.2) 2px,transparent 2.6px);background-size:22px 22px;background-position:6px 6px}
.own{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.35);color:#fff;border-radius:10px;padding:2px 8px;font-size:12px}
.ci2{padding:9px 11px 11px}.ci2 b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{font-size:12px}.pp{font-weight:700;color:var(--ton);margin-top:3px;font-size:15px}
em{font-style:normal;font-size:11px;font-weight:600;margin-left:4px}.up2{color:var(--ok)}.dn{color:var(--bad)}
.num{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#6ab3f3,#2a7fd0);display:grid;place-items:center;color:#fff;font-size:19px}
.empty{text-align:center;color:var(--tx2);padding:56px 24px}.empty b{font-size:44px;display:block;margin-bottom:6px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
#ov.on{opacity:1;pointer-events:auto}
#sh{position:absolute;bottom:0;left:50%;width:100%;max-width:480px;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;transform:translate(-50%,100%);transition:transform .45s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom,0px);touch-action:pan-y}
#ov.on #sh{transform:translate(-50%,0)}
#dc{animation-duration:.4s;animation-fill-mode:both}
.sr{animation-name:inR}.sl{animation-name:inL}
@keyframes inR{from{transform:translateX(50px);opacity:0}}@keyframes inL{from{transform:translateX(-50px);opacity:0}}
.hero{position:relative;height:290px;display:grid;place-items:center;overflow:hidden}
.hero img{width:200px;animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) rotate(2deg)}}
.cl{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:#fff;font-size:15px;cursor:pointer;z-index:2}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.25);color:#fff;font-size:16px;cursor:pointer;z-index:2}
.pd{position:absolute;bottom:12px;display:flex;gap:5px;z-index:2}.pd i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);transition:.3s}.pd i.on{width:16px;background:#fff}
.bd{padding:16px 18px 18px}.bd h2{margin:0;font-size:22px}.sub{color:var(--tx2);font-size:14px;margin:2px 0 14px}
.rar{display:inline-block;margin:12px 0;padding:4px 12px;border-radius:12px;font-size:13px;font-weight:600}
.at{background:var(--bg2);border-radius:14px;margin-bottom:14px}
.at div{display:flex;justify-content:space-between;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line)}.at div:last-child{border:0}
.at span{color:var(--tx2)}.at b{font-weight:600}.at b small{color:var(--tx2);font-weight:500;margin-left:5px}
.prc{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.prc span{color:var(--tx2);font-size:14px}.prc b{font-size:24px;color:var(--ton)}
.sk{animation:sk .4s}@keyframes sk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#gf{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 40%,#2a3f57,#0b121a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;pointer-events:none;transition:opacity .35s}
#gf.on{opacity:1;pointer-events:auto}
.gbox{font-size:120px;line-height:1;animation:shk 1.3s ease-in-out both;position:absolute}
#gf.rv .gbox{animation:none;transform:scale(0);opacity:0;transition:.3s}
@keyframes shk{0%{transform:scale(.3) rotate(0)}20%{transform:scale(1.05) rotate(-9deg)}35%{transform:rotate(9deg)}50%{transform:rotate(-12deg)}65%{transform:rotate(12deg)}80%{transform:scale(1.15) rotate(-6deg)}100%{transform:scale(1.25)}}
.fc{perspective:900px;width:230px;height:300px;transform:scale(0);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
#gf.rv .fc{transform:scale(1)}
.ci{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(180deg);transition:transform .9s cubic-bezier(.3,.8,.3,1)}
#gf.fp .ci{transform:rotateY(0)}
.ci>div{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
.bk{background:linear-gradient(135deg,#2aabee,#1c5f9c);font-size:80px;transform:rotateY(180deg)}
.fr .th{position:absolute;inset:0;aspect-ratio:auto}.fr .tx{position:absolute;bottom:14px;left:0;right:0;z-index:2}.fr .tx b{font-size:18px;display:block}
.gt{color:#fff;font-size:15px;opacity:0;height:20px;transition:opacity .4s .2s}#gf.fp .gt{opacity:1}
#gok{opacity:0;transition:opacity .4s .5s;padding:12px 40px}#gf.fp #gok{opacity:1}
.cf{position:absolute;top:-30px;font-size:20px;animation:cfd 2.4s linear forwards;pointer-events:none}
@keyframes cfd{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
#toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-16px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:18px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fd{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.fd div{background:var(--bg);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--tx2)}.fd div:first-child{animation:pop .4s both}.fd b{color:var(--tx)}#mk2{flex-direction:column;align-items:stretch!important;gap:4px}
.lp{margin-bottom:10px}.lp label{display:block;font-size:13px;color:var(--tx2)}.lp input{display:block;width:100%;margin-top:6px;padding:12px 14px;font:inherit;font-size:18px;font-weight:700;color:var(--tx);background:var(--bg2);border:2px solid transparent;border-radius:12px;outline:0}.lp input:focus{border-color:var(--ac)}.lc{margin-top:8px;font-size:14px;font-weight:600}
#cfw{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.pf{display:flex;flex-direction:column;align-items:center;gap:3px;padding:16px 0 10px}
.pav{width:96px;height:96px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:40px;font-weight:700;color:#fff;background:linear-gradient(135deg,#5fc9ff,#0072b8);margin-bottom:6px}.pav img{width:100%;height:100%;object-fit:cover}
.pf b{font-size:20px}.pf span{color:var(--tx2);font-size:14px}
.fld{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}.fld:last-child{border:0}.fld label{width:84px;color:var(--tx2);font-size:14px}.fld input{flex:1;min-width:0;border:0;background:none;padding:13px 0;font:inherit;color:var(--tx);outline:0}
.pk{display:flex;gap:10px;overflow-x:auto;padding:6px 4px 10px}.pk div{flex:none;width:72px;height:72px;border-radius:50%;overflow:hidden;border:3px solid transparent;cursor:pointer;transition:.2s}.pk div.on{border-color:var(--ac);transform:scale(1.08)}.pk img{width:100%;height:100%;object-fit:cover;display:block}
#v3{padding:0}
.ph{position:relative;background:linear-gradient(165deg,#2c9cf0,#5b63e3);color:#fff;text-align:center;padding:54px 0 18px;overflow:hidden}
.fgw{position:absolute;z-index:1;transform:translate(-50%,-50%)}.fgw img{width:48px;height:48px;object-fit:contain;display:block;pointer-events:none}
.ph.ed .fgw{z-index:4;touch-action:none;cursor:grab;outline:1.5px dashed rgba(255,255,255,.55);outline-offset:4px;border-radius:8px}
.bx{position:absolute;top:-12px;right:-12px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:22px;padding:0;cursor:pointer}
.hint{font-size:13px;color:var(--tx2);margin:0 4px 8px}
.pb{position:absolute;top:12px;border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:16px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;z-index:6;backdrop-filter:blur(6px)}.pb.l{left:12px;font-size:18px;padding:3px 13px}.pb.r{right:12px}
.ph .pav{position:relative;z-index:2;margin:0 auto 10px;border:3px solid rgba(255,255,255,.9)}
.nm{display:flex;align-items:center;justify-content:center;gap:7px;position:relative;z-index:2}.nm b{font-size:22px}.stt{width:30px;height:30px;object-fit:contain;animation:pop .5s both}
.ph small{display:block;opacity:.8;font-size:14px;position:relative;z-index:2}
.pc{padding:12px}
.ic{background:var(--bg);border-radius:14px;margin-bottom:12px}.ic div{position:relative;padding:10px 14px;border-bottom:1px solid var(--line)}.ic div:last-child{border:0}.ic span{display:block;font-size:12px;color:var(--tx2)}.ic b{color:var(--ac);font-weight:500}.ic i{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--ac);font-size:22px}
.tb{display:flex;background:var(--bg);border-radius:14px 14px 0 0;border-bottom:1px solid var(--line);margin-bottom:10px}.tb button{flex:1;border:0;background:none;padding:12px 0;font:inherit;font-size:14px;color:var(--tx2);cursor:pointer;position:relative}.tb button.on{color:var(--ac)}.tb button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:2.5px;border-radius:2px;background:var(--ac)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gtl{position:relative;aspect-ratio:.92;border-radius:14px;overflow:hidden;display:grid;place-items:center;cursor:pointer;animation:pop .45s both;transition:transform .15s}.gtl:active{transform:scale(.95)}
.gtl img{width:80%;aspect-ratio:1;object-fit:contain;border-radius:0;position:relative;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.rb{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.32);color:#fff;font-size:10px;padding:2px 6px;border-radius:8px}.pin{position:absolute;top:5px;left:6px;font-size:12px}
.foot{text-align:center;margin:20px 0 6px}.foot a{color:var(--tx2);font-size:13px;cursor:pointer;text-decoration:underline}
.rk{width:30px;text-align:center;font-weight:700;color:var(--tx2);font-size:16px}
.tav{width:40px;height:40px;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:700;background:linear-gradient(135deg,#5fc9ff,#0072b8);flex:none}.tav img{width:100%;height:100%;object-fit:cover}
.od{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px}
.meRow{background:rgba(42,171,238,.12)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="app">
<header><div class="hl"><div class="av">💎</div><div><b id="hn">Игрок</b><small id="lvl"></small></div></div><div class="bal"><span id="bal">0</span> <i>TON</i></div></header>
<div id="views">
<section id="v0" class="on">
 <div class="pg"><div class="tp"><span id="lv2"></span><span id="lvn"></span></div><div class="bar"><i id="pb"></i></div></div>
 <div class="tz" id="tz"><button id="coin" aria-label="Тап">💎</button><div class="chips"><span><b id="c1"></b> за тап</span><span><b id="c2"></b> в сек</span></div></div>
 <h3>Улучшения</h3><div class="lst" id="ups"></div>
</section>
<section id="v1">
 <div class="seg"><button class="on" data-m="nft">Подарки</button><button data-m="num">Номера</button></div>
 <div class="fd" id="fd"></div><div class="fs" id="fs"></div><div id="mk"></div>
</section>
<section id="v2"><div id="inv"></div><div class="foot"><a id="reset">Сбросить прогресс</a></div></section>
<section id="v3"><div id="pf"></div></section>
<section id="v4"><div id="tp"><div class="empty"><b>📡</b>Загрузка...</div></div></section>
</div>
<nav><div class="ind" id="ind"><i></i></div>
 <button class="on" data-t="0"><b>💎</b>Фарм</button><button data-t="1"><b>🛍</b>Маркет</button><button data-t="2"><b>🎁</b>Коллекция</button><button data-t="3"><b>👤</b>Профиль</button><button data-t="4"><b>🏆</b>Топ</button>
</nav>
</div>
<div id="ov"><div id="sh"><div id="dc"></div></div></div>
<div id="cfw"></div><input type="file" id="pfile" accept="image/*" hidden>

const pr=a=>a.map(s=>{const[i,t]=s.split("|");return[+i,t]});
const EV={
honey:pr(["+6|Мишек показали в тренде","+12|Блогер выложил свою коллекцию","+4|Мало мишек на продаже","+9|Праздничный ажиотаж","+3|Пришёл новый коллекционер","+7|Мишек скупили оптом","+15|Мишка попал в подборку недели","+5|Растёт спрос на классику","-4|Много предложений на рынке","-8|Кто-то сбросил сто мишек","-3|Интерес к классике остыл","-11|Мода сменилась","-6|Новые подарки отвлекают","-2|Тихий день на рынке","-9|Массовая распродажа"]),
box:pr(["+10|Повар-блогер показал лапшу","+6|Хайп вокруг фастфуда","+4|Лапшу берут в коллекцию","+13|Звёздная модель в моде","+3|Спрос в ночные часы","+8|Лапша в топе поиска","+5|Скупили всё по низу","+7|Друзья обсуждают вкус","-7|Рынок завален лапшой","-12|Кто-то продал сразу пятьдесят","-4|Интерес пропал","-9|Новая лапша стоит дешевле","-3|Остыл ночной хайп","-6|Продавцы снижают цену","-5|Коллекционеры выжидают"]),
teal:pr(["+8|Плюш в подборке недели","+11|Фиолетовый фон в тренде","+5|Коллекционер собирает набор","+14|Крупный покупатель на рынке","+3|Стабильный спрос","+9|Плюш показали в чате","+6|Мало лотов на продаже","+4|Подарок к празднику","-6|Продавцы демпингуют","-10|Сброс крупного держателя","-3|Плюш вышел из моды","-8|Конкуренция с новыми подарками","-5|Спрос просел","-12|Паника среди владельцев","-2|Затишье на рынке"]),
float:pr(["+13|Новый год: шампанское в цене","+7|Начался праздничный сезон","+10|Яркая сцена в чате","+5|Золотая пробка в дефиците","+16|Знаменитость купила подарок","+4|Сезон вечеринок","+8|Вернулось лето","+6|Подборка для праздника","-9|После праздников спрос упал","-5|Много новых предложений","-14|Крупный сброс","-3|Сезонная пауза","-7|Покупатели ждут скидок","-11|Шампанское приелось","-4|Дешевеет к концу недели"]),
ramen:pr(["+12|Пришельцы в тренде","+18|Тираж почти скуплен","+7|Фон Космос в моде","+9|Коллекционеры ищут легенду","+5|Растёт интерес к лимитированным","+14|Легенду показали в ленте","+4|Тихая скупка","+10|Конкурс среди владельцев","-8|Продавец сбросил лот","-13|Спекулянты вышли из игры","-5|Лёгкая коррекция","-10|Слух о новом выпуске","-3|Затишье у легенд","-6|Фиксация прибыли","-15|Крупный дамп"]),
ring:pr(["+15|Кольцо стало мемом","+9|Радужный градиент в моде","+20|Тираж почти раскуплен","+6|Инвестор собирает коллекцию","+11|Обсуждают в каналах","+7|Уникальная модель","+4|Стабильный рост","+13|Аукцион среди богачей","-10|Спекулянты фиксируют прибыль","-6|Коррекция после роста","-16|Крупный продавец вышел","-4|Затишье","-8|Слух о повторном выпуске","-12|Пузырь сдувается","-3|Тихая торговля"])
};
const H={},F=[],LE={};N.forEach(n=>H[n.id]=[n.p]);
const ppH=id=>`${fmt(P[id],2)} TON${chg(id)}`;
const sg=v=>(v>0?"+":"")+v+"%";
const leH=id=>LE[id]?`${LE[id][0]>0?"📈":"📉"} ${sg(LE[id][0])} · ${LE[id][1]}`:"Рынок спокоен";
function spark(id){const a=H[id],mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1,k=Math.max(a.length-1,1);const pts=a.map((v,i)=>`${(i/k*200).toFixed(1)},${(46-(v-mn)/r*42).toFixed(1)}`).join(" ");return `<svg viewBox="0 0 200 50" preserveAspectRatio="none" style="width:100%;height:56px"><polyline points="${pts}" fill="none" stroke="${a[a.length-1]>=a[0]?"#31b545":"#ef5350"}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`}
const mk2=id=>spark(id)+`<span>${leH(id)}</span>`;
function feed(){const e=$("#fd");e.style.display=mode==="nft"&&F.length?"flex":"none";e.innerHTML=F.slice(0,3).map(f=>`<div>${f.p>0?"📈":"📉"} <b>${get(f.id).n}</b> ${sg(f.p)} · ${f.t}</div>`).join("")}
function tick(){
 const n=N[Math.random()*N.length|0],ev=EV[n.id][Math.random()*15|0],id=n.id;
 P[id]=Math.min(B[id]*3,Math.max(B[id]*.4,P[id]*(1+ev[0]/100)));
 H[id].push(P[id]);if(H[id].length>24)H[id].shift();
 LE[id]=ev;F.unshift({id,p:ev[0],t:ev[1]});F.length=Math.min(F.length,4);
 $$('[data-pp="'+id+'"]').forEach(e=>e.innerHTML=ppH(id));feed();
 if(cur===id&&$("#ov").classList.contains("on")){$("#dp").innerHTML=fmt(P[id],2)+" TON"+chg(id);$("#mk2").innerHTML=mk2(id);const bb=$("#bb"),sb=$("[data-sell]");if($("#lpi"))updCh();if(bb)bb.textContent="Купить за "+fmt(P[id],2)+" TON";if(sb)sb.textContent="Продать за "+fmt(P[id]*.9,2)+" TON"}
}
const chance=(pr,fl)=>pr<fl*.995?99:Math.max(2,Math.round(80-Math.max(0,pr/fl-1)*300));
function ob(n){const id=n.id,L=S.list[id];
 const sb=`<button class="btn big ghost" style="margin-bottom:8px" data-stat="${id}">${S.prof.st===id?"Убрать из статуса":"Поставить рядом с ником"}</button>`;
 if(L)return sb+`<div class="at"><div><span>Выставлено за</span><b>${fmt(L.price,2)} TON</b></div><div><span>Шанс продажи</span><b>${L.ch}%</b></div><div><span>Статус</span><b>Ждёт покупателя</b></div></div><button class="btn big ghost" data-unlist="${id}">Снять с продажи</button>`;
 return sb+`<div class="lp"><label>Цена продажи, TON<input id="lpi" type="number" min="0.01" step="0.01" inputmode="decimal" value="${fmt(P[id],2)}"></label><div class="lc" id="lch"></div></div><button class="btn big" data-list="${id}">Выставить на продажу</button><button class="btn big ghost" style="margin-top:8px" data-sell="${id}">Продать сразу за ${fmt(P[id]*.9,2)} TON</button>`}
function updCh(){const i=$("#lpi");if(!i)return;const id=cur,v=parseFloat(i.value),e=$("#lch");if(!(v>0)){e.textContent="Введите цену";e.style.color="var(--tx2)";return}const c=chance(v,P[id]);e.textContent=`Шанс продажи: ${c}% · флор ${fmt(P[id],2)} TON`;e.style.color=c>=75?"var(--ok)":c>=35?"#f5a623":"var(--bad)"}
document.addEventListener("input",e=>{if(e.target.id==="lpi")updCh()});
setInterval(()=>{const now=Date.now();Object.keys(S.list).forEach(id=>{const L=S.list[id];if(L.sellAt&&now>=L.sellAt){const n=get(id);S.bal+=L.price;delete S.own[id];delete S.list[id];navL=navL.filter(x=>x!==id);toast("Куплен «"+n.n+"»: +"+fmt(L.price,2)+" TON");save();head();if(cur===id&&$("#ov").classList.contains("on"))close();render()}})},1000);
let dg=null;
document.addEventListener("pointerdown",e=>{const w=e.target.closest(".fgw");if(!w||!pedit||e.target.closest(".bx"))return;dg={w,h:w.parentElement.getBoundingClientRect(),i:+w.dataset.i};try{w.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
document.addEventListener("pointermove",e=>{if(!dg)return;dg.x=Math.min(97,Math.max(3,(e.clientX-dg.h.left)/dg.h.width*100));dg.y=Math.min(95,Math.max(5,(e.clientY-dg.h.top)/dg.h.height*100));dg.w.style.left=dg.x+"%";dg.w.style.top=dg.y+"%"});
document.addEventListener("pointerup",()=>{if(dg&&dg.x!==undefined){const o=S.prof.bg[dg.i];if(o){o.x=+dg.x.toFixed(1);o.y=+dg.y.toFixed(1);save()}}dg=null});
$("#pfile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=256;const s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);S.prof.ph=c.toDataURL("image/jpeg",.85);S.prof.av="";save();render();toast("Фото обновлено")};im.src=r.result};r.readAsDataURL(f);e.target.value=""});
setInterval(tick,5000);

/* ===== ОНЛАЙН И ТОП ===== */
const API="";/* пусто = сервер с игрой на том же домене; иначе например "https://my-server.com" */
const tg=window.Telegram&&Telegram.WebApp;if(tg){try{tg.ready();tg.expand()}catch(e){}}
let pid=null;try{pid=localStorage.getItem("tonpid");if(!pid){pid="w"+Math.random().toString(36).slice(2,10);localStorage.setItem("tonpid",pid)}}catch(e){pid="w"+Math.random().toString(36).slice(2,10)}
try{const tu=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;if(tu&&tu.id)pid="t"+tu.id}catch(e){}
let OL=null,first=true,phSent="",phBad=null,phBusy=false;
const snap=()=>{const c=JSON.parse(JSON.stringify(S));if(c.prof)c.prof.ph="";return c};
function restore(st){
 try{
  if(!st||(st.tot||0)<=(S.tot||0))return;
  const ph=S.prof&&S.prof.ph;
  const n=Object.assign(JSON.parse(JSON.stringify(DEF)),st);
  n.lv=Object.assign({tap:0,auto:0,mult:0},st.lv);
  n.prof=Object.assign({},DEF.prof,st.prof,{ph:ph||""});
  S=n;save();render();toast("Прогресс восстановлен");
 }catch(e){}
}
function restorePh(ph){
 phSent=ph||"";
 if(ph&&!S.prof.ph&&!S.prof.av){S.prof.ph=ph;save();render()}
}
async function upPhoto(){
 const v=S.prof.ph||"";
 if(phBusy||v===phBad)return;phBusy=true;
 try{
  const r=await fetch(API+"/api/photo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg?tg.initData:"",id:pid,ph:v})});
  if(r.ok){phSent=v;phBad=null;sync()}else phBad=v;
 }catch(e){}
 phBusy=false;
}
setInterval(()=>{if(!first&&(S.prof.ph||"")!==phSent)upPhoto()},2000);
async function sync(){
 try{
  const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  const nm=(S.prof.name&&S.prof.name!=="Игрок")?S.prof.name:((u&&u.first_name)||"Игрок");
  const r=await fetch(API+"/api/sync",{method:"POST",headers:{"Content-Type":"application/json"},keepalive:true,body:JSON.stringify({initData:tg?tg.initData:"",id:pid,name:nm,bal:S.bal,av:S.prof.av||"",restore:first,st:first?undefined:snap()})});
  if(!r.ok)throw 0;OL=await r.json();if(first){first=false;restore(OL.st);restorePh(OL.ph)}delete OL.st;delete OL.ph
 }catch(e){if(OL)OL.err=1;else OL={err:1,top:[],online:0,total:0}}
 drawTop();head();
}
function drawTop(){
 const e=$("#tp");if(!e)return;
 if(!OL||(OL.err&&!OL.top.length)){e.innerHTML='<div class="empty"><b>📡</b>Нет связи с сервером.<br>Топ и онлайн появятся, когда он станет доступен.</div>';return}
 const av=p=>{
  if(p.me&&S.prof.ph)return `<img src="${S.prof.ph}" alt="">`;
  if(p.pu)return `<img src="${API}/api/photo/${encodeURIComponent(p.pu)}.jpg?v=${encodeURIComponent(p.pv||"")}" alt="" loading="lazy">`;
  return IMG[p.av]?`<img src="${IMG[p.av]}" alt="">`:esc((p.name||"И").slice(0,1).toUpperCase());
 };
 e.innerHTML=`<div class="pg"><div class="tp"><span>🟢 Сейчас онлайн</span><span>Всего игроков: ${OL.total}</span></div><b style="font-size:26px">${OL.online}</b></div><h3>Топ по балансу</h3><div class="lst">`+OL.top.map((p,i)=>`<div class="row${p.me?" meRow":""}"><div class="rk">${i<3?["🥇","🥈","🥉"][i]:i+1}</div><div class="tav">${av(p)}</div><div class="t"><b>${esc(p.name)}${p.me?" (вы)":""}</b><span>${p.on?'<i class="od"></i>онлайн':"не в сети"}</span></div><b style="color:var(--ton)">${fmt(p.bal,2)} TON</b></div>`).join("")+"</div>"+(OL.me&&OL.me>OL.top.length?`<div class="pg"><div class="tp"><span>Ваше место</span><b style="color:var(--tx)">#${OL.me}</b></div></div>`:"");
}
setInterval(()=>{if(!document.hidden)sync()},15000);
document.addEventListener("visibilitychange",()=>{save();if(!document.hidden||!first)sync()});
setInterval(save,3000);
addEventListener("pagehide",save);
sync();

render();
</script>
</body>
</html>
